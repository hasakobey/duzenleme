# Her gönderimde derler, testleri çalıştırır ve kurulum dosyasıyla taşınabilir zip'leri indirilebilir çıktı olarak ekler
# (dist/: NestDesk-Setup-<sürüm>.exe, NestDesk-<sürüm>-<mimari>-portable.zip). "v" ile başlayan bir etiket gönderilince
# (ör. git tag v2.1.0 && git push origin v2.1.0) aynı dosyalarla GitHub'da sürüm (Release) açar. Etiket, Duzenleme.csproj'daki
# <Version> ile aynı olmalı.
# Kod imzalama (SignPath Foundation, ücretsiz açık kaynak programı) onaylanınca imzalama adımı buraya eklenecek.
name: Derleme

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Etiket sürümle aynı mı
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Duzenleme/Duzenleme.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Etiket $env:GITHUB_REF_NAME, proje sürümü ${version}: aynı olmalı." }

      - name: Testler
        run: dotnet test Duzenleme.sln -c Release

      # NestDesk.iss 6.6+ ister (WizardStyle=modern dynamic). ISCC.exe'nin sürüm bilgisi güvenilir değil (0.0.0.0 olabiliyor):
      # "upgrade" yoksa kurar, eskiyse günceller, güncelse bir şey yapmaz. Eski sürümde derleme #error ile durur.
      - name: Inno Setup
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      - name: Paketle (kurulum + taşınabilir zip'ler)
        shell: powershell
        run: .\tools\publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: NestDesk
          path: dist/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NestDesk
          path: dist

      - name: GitHub sürümü
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "NestDesk ${GITHUB_REF_NAME#v}" --generate-notes
